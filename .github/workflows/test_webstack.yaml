name: Webstack CI

on:
  push:
    branches:
      - dev
  pull_request:

defaults:
  run:
    shell: bash
    working-directory: webstack

jobs:
  run:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 24

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --silent

      - name: Run tests
        # Scoped to projects with a working jest config today, not --all: most
        # other Nx projects (webapp, sageplugin, homebase*) have a test target
        # declared in workspace.json but no jest.config.js ever created (or
        # are missing jest-environment-jsdom) — a pre-existing gap unrelated
        # to this branch. Widen this list as those get fixed.
        run: yarn nx run-many --target=test --projects=sagebase,shared,backend --parallel=1

      - name: Build Homebase
        run: yarn build --if-present

      - name: Build Webapp
        run: yarn build webapp --if-present
